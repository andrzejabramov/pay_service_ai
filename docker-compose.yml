# docker-compose.yml
# Прямая репликация PostgreSQL: pg-master + pg-replica
# Мастер: localhost:5435 → pg-master:5432
# Реплика: localhost:5436 → pg-replica:5432

services:
  pg-master:
    image: postgres:${POSTGRES_VERSION}
    container_name: pg-master
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REPLICATION_USER: ${REPLICATION_USER}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    volumes:
      - ./payment_reply/master/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./payment_reply/master/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./payment_reply/master/init-master.sh:/docker-entrypoint-initdb.d/init-master.sh
      - pg_master_data:/var/lib/postgresql/data
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "${PG_MASTER_PORT}:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  pg-replica:
    image: postgres:${POSTGRES_VERSION}
    container_name: pg-replica
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REPLICATION_USER: ${REPLICATION_USER}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    volumes:
      - ./payment_reply/replica/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./payment_reply/replica/init-replica.sh:/init-replica.sh
      - pg_replica_data:/var/lib/postgresql/data
    ports:
      - "${PG_REPLICA_PORT}:5432"
    depends_on:
      pg-master:
        condition: service_healthy
    command: >
      bash -c "
        chmod +x /init-replica.sh &&
        /init-replica.sh
      "
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - backend

  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: auth
    ports:
      - "8001:8001"
    environment:
      - POSTGRES_HOST=pg-master
      - REDIS_HOST=redis
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      pg-master:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  users:
    build:
      context: ./users
      dockerfile: Dockerfile
    container_name: users
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=pg-master
      - POSTGRES_REPLICA_HOST=pg-replica
      - RABBITMQ_HOST=rabbitmq
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - DATABASE_WRITE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pg-master:5432/${POSTGRES_DB}
      - DATABASE_READ_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pg-replica:5432/${POSTGRES_DB}
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
    depends_on:
      pg-master:
        condition: service_healthy
      pg-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - backend

  webhook_2can:
    build:
      context: ./webhook_2can
      dockerfile: Dockerfile
    container_name: webhook_2can
    ports:
      - "8002:8002"
    environment:
      - POSTGRES_HOST=pg-master
      - RABBITMQ_HOST=rabbitmq
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_URL=${RABBITMQ_URL}
    depends_on:
      pg-master:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - backend

  alpha_hook:
    build:
      context: ./alpha_hook
      dockerfile: Dockerfile
    container_name: alpha_hook
    restart: unless-stopped
    depends_on:
      pg-master:
        condition: service_healthy
      pg-replica:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment:
      - POSTGRES_HOST=pg-master
      - POSTGRES_REPLICA_HOST=pg-replica
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - APP_READER_USER=${APP_READER_USER}
      - APP_READER_PASSWORD=${APP_READER_PASSWORD}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS}
      - ROUTER_API_KEY=${ROUTER_API_KEY}
    ports:
      - "8003:8000" # Только для локальной разработки!
    volumes:
      - ./alpha_hook/logs:/app/logs
      - ./alpha_hook/certs:/app/certs:ro
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/webhook/test')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  contracts:
    build:
      context: ./contracts
      dockerfile: Dockerfile
    container_name: contracts
    ports:
      - "8004:8004"
    environment:
      - POSTGRES_HOST=pg-master
      - POSTGRES_REPLICA_HOST=pg-replica
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # Добавляем JWT (дублируем регистр)
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      pg-master:
        condition: service_healthy
      pg-replica:
        condition: service_healthy
    networks:
      - backend

volumes:
  pg_master_data:
  pg_replica_data:

networks:
  backend:
    driver: bridge
